syntax = "proto3";

package logger;

service LogServer {
    rpc StreamLogs(stream LogEntry) returns (LogAck) {};
}


message LogEntry {
    string thread_id = 1;
    string level = 2;
    string file = 3;
    string line = 4;
    string message = 5;
    string timestamp = 6;
}

message LogAck {
    bool success = 1;
}